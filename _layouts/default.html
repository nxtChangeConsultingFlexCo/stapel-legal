<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
      {% endif %}

      {{ content }}

      <footer class="mt-5 pt-3 border-top f6 text-gray color-fg-muted">
{%- if page.lang == "en" %}
        <a href="{{ "/en/" | absolute_url }}">{{ site.title }}</a> · <a href="{{ "/imprint/" | absolute_url }}">Legal Notice</a> · <a href="https://nxtchange.app/">nxtChange Apps</a>
{%- else %}
        <a href="{{ "/" | absolute_url }}">{{ site.title }}</a> · <a href="{{ "/impressum/" | absolute_url }}">Impressum</a> · <a href="https://nxtchange.app/">nxtChange Apps</a>
{%- endif %}
      </footer>
    </div>
  </body>
</html>
